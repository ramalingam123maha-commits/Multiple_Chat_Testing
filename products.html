<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store - Responsive Shopping</title>
    <link rel="stylesheet" href="products.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">🛍️ Product Store</h1>
            <button class="cart-toggle" id="cartToggle">
                🛒 Cart <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Filter Sidebar -->
        <aside class="filters-sidebar" id="filtersSidebar">
            <div class="filters-header">
                <h2>Filters</h2>
                <button class="close-filters" id="closeFilters">✕</button>
            </div>

            <!-- Category Filter -->
            <div class="filter-group">
                <h3 class="filter-title">Category</h3>
                <div class="filter-options">
                    <label class="checkbox-label">
                        <input type="checkbox" value="all" class="category-filter" checked>
                        <span>All Categories</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" value="electronics" class="category-filter">
                        <span>Electronics</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" value="clothing" class="category-filter">
                        <span>Clothing</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" value="accessories" class="category-filter">
                        <span>Accessories</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" value="home" class="category-filter">
                        <span>Home & Garden</span>
                    </label>
                </div>
            </div>

            <!-- Price Filter -->
            <div class="filter-group">
                <h3 class="filter-title">Price Range</h3>
                <div class="price-range-container">
                    <input type="range" id="priceMin" class="price-input" min="0" max="1000" value="0">
                    <input type="range" id="priceMax" class="price-input" min="0" max="1000" value="1000">
                </div>
                <div class="price-display">
                    $<span id="minPriceDisplay">0</span> - $<span id="maxPriceDisplay">1000</span>
                </div>
            </div>

            <!-- Rating Filter -->
            <div class="filter-group">
                <h3 class="filter-title">Rating</h3>
                <div class="filter-options">
                    <label class="checkbox-label">
                        <input type="checkbox" value="5" class="rating-filter">
                        <span>⭐⭐⭐⭐⭐ 5 Star</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" value="4" class="rating-filter">
                        <span>⭐⭐⭐⭐ 4+ Star</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" value="3" class="rating-filter">
                        <span>⭐⭐⭐ 3+ Star</span>
                    </label>
                </div>
            </div>

            <!-- Reset Filters -->
            <button class="reset-filters" id="resetFilters">Reset All Filters</button>
        </aside>

        <!-- Products Section -->
        <section class="products-section">
            <!-- Mobile Filter Toggle -->
            <div class="mobile-filter-toggle">
                <button class="filter-toggle" id="filterToggle">☰ Filters</button>
                <div class="sort-container">
                    <select id="sortSelect" class="sort-select">
                        <option value="default">Sort By: Default</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid">
                <!-- Products will be inserted here by JavaScript -->
            </div>

            <!-- No Results Message -->
            <div class="no-results" id="noResults" style="display: none;">
                <p>No products found matching your filters.</p>
            </div>
        </section>
    </div>

    <!-- Shopping Cart Drawer -->
    <div class="cart-drawer-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button class="close-cart" id="closeCart">✕</button>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Cart items will be inserted here -->
        </div>

        <div class="cart-empty" id="cartEmpty">
            <p>Your cart is empty</p>
        </div>

        <div class="cart-footer">
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (10%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        </div>
    </div>

    <script src="products.js"></script>
</body>
</html>
