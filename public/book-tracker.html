<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }

    input[type="text"],
    input[type="file"],
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="file"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .book-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .book-cover {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      overflow: hidden;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info {
      padding: 15px;
    }

    .book-title {
      font-weight: 700;
      font-size: 1.1em;
      color: #333;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-author {
      color: #777;
      font-size: 0.9em;
      margin-bottom: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status-to-read {
      background: #ffeaa7;
      color: #d63031;
    }

    .status-reading {
      background: #74b9ff;
      color: #0984e3;
    }

    .status-finished {
      background: #81ecec;
      color: #00b894;
    }

    .book-rating {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .star {
      font-size: 1.2em;
      cursor: pointer;
      color: #ddd;
      transition: color 0.2s;
    }

    .star.active {
      color: #ffc107;
    }

    .star:hover {
      color: #ffc107;
    }

    .book-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-small {
      flex: 1;
      padding: 8px;
      font-size: 0.85em;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-small:hover {
      background: #764ba2;
    }

    .btn-delete {
      background: #d63031;
    }

    .btn-delete:hover {
      background: #e84118;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .stat-value {
      font-size: 2.5em;
      font-weight: 700;
      color: #667eea;
      margin: 10px 0;
    }

    .stat-label {
      color: #777;
      font-size: 0.9em;
    }

    .status-breakdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .status-item {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .status-item-count {
      font-size: 2em;
      font-weight: 700;
      margin: 10px 0;
    }

    .status-item-label {
      color: #777;
      font-size: 0.9em;
    }

    .monthly-chart {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    .monthly-chart h3 {
      color: #333;
      margin-bottom: 20px;
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 200px;
      gap: 10px;
    }

    .chart-bar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 4px 4px 0 0;
      min-height: 10px;
      transition: opacity 0.2s;
    }

    .bar:hover {
      opacity: 0.8;
    }

    .bar-label {
      font-size: 0.75em;
      color: #777;
      margin-top: 5px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .section-title {
      color: white;
      font-size: 1.8em;
      margin-bottom: 20px;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .books-grid {
        grid-template-columns: 1fr;
      }

      .status-breakdown {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Book Tracker</h1>
      <p>Track your reading journey</p>
    </header>

    <div class="main-grid">
      <!-- Add Book Form -->
      <div class="card">
        <h2>Add New Book</h2>
        <form id="addBookForm">
          <div class="form-group">
            <label for="bookTitle">Title *</label>
            <input type="text" id="bookTitle" placeholder="Enter book title" required>
          </div>
          <div class="form-group">
            <label for="bookAuthor">Author *</label>
            <input type="text" id="bookAuthor" placeholder="Enter author name" required>
          </div>
          <div class="form-group">
            <label for="bookCover">Cover Image</label>
            <input type="file" id="bookCover" accept="image/*">
          </div>
          <button type="submit">Add Book</button>
        </form>
      </div>

      <!-- Stats Dashboard -->
      <div>
        <div class="stats-grid" id="statsContainer"></div>
        <div class="card">
          <h2>Books by Status</h2>
          <div class="status-breakdown" id="statusBreakdown"></div>
        </div>
      </div>
    </div>

    <!-- Monthly Chart -->
    <div class="monthly-chart">
      <h3>Books Finished Per Month</h3>
      <div class="chart-bars" id="monthlyChart"></div>
    </div>

    <!-- Books Section Title -->
    <div class="section-title">Your Library</div>

    <!-- Books Grid -->
    <div class="books-grid" id="booksGrid"></div>
  </div>

  <script>
    const API_URL = 'http://localhost:3001/api';

    // Initialize app
    async function init() {
      loadBooks();
      loadStats();
    }

    // Load all books
    async function loadBooks() {
      try {
        const response = await fetch(`${API_URL}/books`);
        const books = await response.json();
        renderBooks(books);
      } catch (error) {
        console.error('Error loading books:', error);
      }
    }

    // Render books
    function renderBooks(books) {
      const grid = document.getElementById('booksGrid');
      
      if (books.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-state-icon">📖</div>
            <p>No books yet. Add your first book to get started!</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = books.map(book => `
        <div class="book-card">
          <div class="book-cover">
            ${book.coverImage ? `<img src="${book.coverImage}" alt="${book.title}">` : '📖'}
          </div>
          <div class="book-info">
            <div class="book-title">${book.title}</div>
            <div class="book-author">by ${book.author}</div>
            <div class="book-status status-${book.status.toLowerCase().replace(' ', '-')}">
              ${book.status}
            </div>
            <div class="book-rating">
              ${renderStars(book.id, book.rating)}
            </div>
            <div class="book-controls">
              ${renderStatusButtons(book.id, book.status)}
            </div>
            <div class="book-controls">
              <button class="btn-small" onclick="deleteBook(${book.id})">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Render star rating
    function renderStars(bookId, currentRating = 0) {
      return Array.from({ length: 5 }, (_, i) => `
        <span class="star ${i < currentRating ? 'active' : ''}" 
              onclick="setRating(${bookId}, ${i + 1})" 
              title="${i + 1} stars">★</span>
      `).join('');
    }

    // Render status buttons
    function renderStatusButtons(bookId, currentStatus) {
      const statuses = ['To Read', 'Reading', 'Finished'];
      return statuses.map(status => `
        <button class="btn-small" 
                style="background: ${currentStatus === status ? '#667eea' : '#ddd'}; color: ${currentStatus === status ? 'white' : '#333'};"
                onclick="updateStatus(${bookId}, '${status}')">
          ${status}
        </button>
      `).join('');
    }

    // Add book
    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('title', document.getElementById('bookTitle').value);
      formData.append('author', document.getElementById('bookAuthor').value);
      
      const fileInput = document.getElementById('bookCover');
      if (fileInput.files.length > 0) {
        formData.append('coverImage', fileInput.files[0]);
      }

      try {
        const response = await fetch(`${API_URL}/books`, {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          document.getElementById('addBookForm').reset();
          loadBooks();
          loadStats();
        }
      } catch (error) {
        console.error('Error adding book:', error);
        alert('Error adding book');
      }
    });

    // Update status
    async function updateStatus(bookId, status) {
      try {
        await fetch(`${API_URL}/books/${bookId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        loadBooks();
        loadStats();
      } catch (error) {
        console.error('Error updating status:', error);
      }
    }

    // Set rating
    async function setRating(bookId, rating) {
      try {
        await fetch(`${API_URL}/books/${bookId}/rating`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating })
        });
        loadBooks();
        loadStats();
      } catch (error) {
        console.error('Error setting rating:', error);
      }
    }

    // Delete book
    async function deleteBook(bookId) {
      if (confirm('Are you sure you want to delete this book?')) {
        try {
          await fetch(`${API_URL}/books/${bookId}`, {
            method: 'DELETE'
          });
          loadBooks();
          loadStats();
        } catch (error) {
          console.error('Error deleting book:', error);
        }
      }
    }

    // Load stats
    async function loadStats() {
      try {
        const response = await fetch(`${API_URL}/stats`);
        const stats = await response.json();
        renderStats(stats);
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    // Render stats
    function renderStats(stats) {
      // Stats cards
      const statsContainer = document.getElementById('statsContainer');
      statsContainer.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Books</div>
          <div class="stat-value">${stats.total}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Average Rating</div>
          <div class="stat-value">${stats.averageRating} ⭐</div>
        </div>
      `;

      // Status breakdown
      const statusMap = {};
      stats.byStatus.forEach(item => {
        statusMap[item.status] = item.count;
      });

      const statusBreakdown = document.getElementById('statusBreakdown');
      statusBreakdown.innerHTML = `
        <div class="status-item">
          <div class="status-item-label">To Read</div>
          <div class="status-item-count">${statusMap['To Read'] || 0}</div>
        </div>
        <div class="status-item">
          <div class="status-item-label">Reading</div>
          <div class="status-item-count">${statusMap['Reading'] || 0}</div>
        </div>
        <div class="status-item">
          <div class="status-item-label">Finished</div>
          <div class="status-item-count">${statusMap['Finished'] || 0}</div>
        </div>
      `;

      // Monthly chart
      const monthlyChart = document.getElementById('monthlyChart');
      const maxBooks = Math.max(...stats.booksPerMonth.map(m => m.count), 1);
      
      monthlyChart.innerHTML = stats.booksPerMonth.length > 0 
        ? stats.booksPerMonth.map(item => {
            const date = new Date(item.month + '-01');
            const month = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            const height = (item.count / maxBooks) * 100;
            return `
              <div class="chart-bar">
                <div class="bar" style="height: ${Math.max(height, 5)}%;"></div>
                <div class="bar-label">${item.count}</div>
                <div class="bar-label" style="font-size: 0.7em;">${month}</div>
              </div>
            `;
          }).join('')
        : '<div class="empty-state">No finished books yet</div>';
    }

    // Initialize on page load
    window.addEventListener('load', init);
  </script>
</body>
</html>
