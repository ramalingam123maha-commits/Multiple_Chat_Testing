<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="password-generator.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🔐 Secure Password Generator</h1>
            <p class="subtitle">Generate strong, random passwords instantly</p>
        </header>

        <main class="generator-card">
            <!-- Password Output -->
            <div class="password-output">
                <input
                    type="text"
                    id="passwordOutput"
                    class="password-field"
                    readonly
                    aria-label="Generated password"
                >
                <button id="copyBtn" class="icon-btn" title="Copy to clipboard" aria-label="Copy to clipboard">📋</button>
                <button id="generateBtn" class="icon-btn" title="Generate new password" aria-label="Generate new password">🔄</button>
            </div>
            <span id="copyFeedback" class="copy-feedback">Copied!</span>

            <!-- Strength Indicator -->
            <div class="strength-section">
                <div class="strength-bar-track">
                    <div id="strengthBar" class="strength-bar-fill"></div>
                </div>
                <span id="strengthLabel" class="strength-label">Strength</span>
            </div>

            <!-- Options -->
            <div class="options-panel">
                <div class="option-row">
                    <label for="lengthSlider">Password Length</label>
                    <span id="lengthValue" class="length-value">16</span>
                </div>
                <input type="range" id="lengthSlider" min="4" max="64" value="16" class="length-slider">

                <div class="checkbox-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" id="uppercaseOption" checked>
                        <span>Uppercase (A-Z)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="lowercaseOption" checked>
                        <span>Lowercase (a-z)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="numbersOption" checked>
                        <span>Numbers (0-9)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="symbolsOption" checked>
                        <span>Symbols (!@#$...)</span>
                    </label>
                </div>
            </div>

            <button id="generateMainBtn" class="generate-btn">Generate Password</button>
            <p id="optionsError" class="options-error"></p>
        </main>

        <!-- History -->
        <section class="history-section">
            <div class="history-header">
                <h2>History</h2>
                <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
            </div>
            <ul id="historyList" class="history-list">
                <li class="history-empty">No passwords generated yet.</li>
            </ul>
        </section>
    </div>

    <script src="password-generator.js"></script>
</body>
</html>
